name: EchoShield CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Backend & ML Model Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ML Models & Feature Extractor
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'backend')
          from app.ml.voice_classifier_service import is_model_available, load_voice_model
          from app.ml.feature_extractor import NUM_FEATURES, FEATURE_NAMES

          model, scaler, meta = load_voice_model()
          assert model is not None, 'Trained voice classifier model failed to load'
          assert scaler is not None, 'Voice feature scaler failed to load'
          assert NUM_FEATURES == 91, f'Expected 91 features, got {NUM_FEATURES}'
          assert len(FEATURE_NAMES) == 91, 'Feature names mismatch'
          print('[CI PASS] ML Voice Model and 91-feature extractor verified successfully.')
          "

      - name: Execute Full Test Suite
        env:
          DEEPFAKE_MODEL_PATH: ""
        run: |
          python -m unittest discover -s backend/tests -v

      - name: Verify API Endpoints & ML Inference
        run: |
          python -c "
          import sys, os, io, numpy as np, soundfile as sf
          sys.path.insert(0, 'backend')
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          # 1. Health check
          h_resp = client.get('/health')
          assert h_resp.status_code == 200, f'Health check failed: {h_resp.status_code}'
          assert h_resp.json().get('status') == 'ok', 'Status not ok'

          # 2. Voice authenticity detection endpoint
          sr = 16000
          t = np.linspace(0, 1.0, sr, endpoint=False)
          sig = (0.4 * np.sin(2 * np.pi * 350 * t)).astype(np.float32)
          buf = io.BytesIO()
          sf.write(buf, sig, sr, format='WAV')
          wav_bytes = buf.getvalue()

          v_resp = client.post('/detect-voice', files={'audio': ('test.wav', wav_bytes, 'audio/wav')})
          assert v_resp.status_code == 200, f'Voice detection failed: {v_resp.status_code}'
          v_data = v_resp.json()
          assert 'voice_type' in v_data, 'Missing voice_type'
          assert 'ai_voice_percentage' in v_data, 'Missing ai_voice_percentage'
          print('[CI PASS] API endpoints verified:', v_data.get('voice_type'), v_data.get('voice_verdict'))
          "

  build-and-validate:
    name: Build & Codebase Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python Syntax
        run: |
          python -m py_compile $(find backend api -name '*.py')
          echo "[CI PASS] All Python source files compiled successfully without syntax errors."

      - name: Validate Configuration Files
        run: |
          python -c "
          import json
          for f in ['vercel.json', 'package.json', 'backend/app/ml/voice_model_metadata.json']:
              with open(f, 'r') as fp:
                  json.load(fp)
          print('[CI PASS] All JSON configurations are strictly valid.')
          "

      - name: Validate Web Frontend Assets
        run: |
          python -c "
          import os
          for p in ['public/index.html', 'web-dashboard/index.html']:
              assert os.path.exists(p), f'Missing {p}'
              size = os.path.getsize(p)
              assert size > 10000, f'{p} is suspiciously small ({size} bytes)'
          print('[CI PASS] Web dashboard assets validated.')
          "

      - name: Validate Vercel Build Compatibility
        run: |
          python -c "
          import os
          with open('.vercelignore', 'r') as f:
              content = f.read()
          assert 'backend/ml_training/data/' in content, 'Raw training data must be excluded from Vercel'
          print('[CI PASS] Vercel serverless size guards verified.')
          "
